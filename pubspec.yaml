name: tombola
description: "Tombola Board - Applicazione per proiettare il tabellone della tombola"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  # Audio per suoni estrazione e festa
  audioplayers: ^6.1.0
  
  # Font eleganti
  google_fonts: ^6.2.1
  
  # Animazioni fluide
  flutter_animate: ^4.5.0
  
  # State management
  provider: ^6.1.2
  
  # Persistenza impostazioni
  shared_preferences: ^2.2.2
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/audio/
    - assets/icons/lottery.png
